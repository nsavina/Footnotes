# Local development. Credentials here are for local use only.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: footnotes
      POSTGRES_PASSWORD: footnotes
      POSTGRES_DB: footnotes
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U footnotes -d footnotes"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: .
    command: sh -c "alembic upgrade head && uvicorn footnotes.app:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://footnotes:footnotes@db:5432/footnotes
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
